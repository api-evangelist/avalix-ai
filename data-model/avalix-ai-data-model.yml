  job_id: uuid (declared format)
  passport_id: opaque string
  warranty_id: opaque string
  project_id: opaque string
  offer slugs: kebab-case (mcp-compatibility, openapi-repair, agent-contract, receipt-verifier, custom-task-25/49/99, integration-warranty-7d)
  x402 service ids: autonoma-<product>
schema_coverage:
  declared_schemas: 1
  declared_request_bodies_with_shape: 4
