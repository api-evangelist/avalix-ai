media_type: application/json
auth:
  style: >-
    No API key and no OAuth. Public routes (catalog, previews, demo, samples, verification) need nothing.
    Paid routes are gated by x402 PAYMENT: POST once, receive 402 with exact Base USDC requirements, pay,
    retry the same POST with Payment-Signature. The private quote/job/project routes use a bearer token the
    server issues per quote or per accepted job (securityScheme reportToken, http bearer) — the OpenAPI calls
    it a quote token on the acceptance routes and a report token on the read routes.
  detail: authentication/avalix-ai-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  scope: []
  retention: undocumented
  description: >-
    No Idempotency-Key header, parameter or body field exists on any of the 24 write operations, and neither
    llms.txt nor the agents page documents one. What the payment layer offers instead is a settlement
    binding: each 402 names an exact amount and recipient, the retry carries a Payment-Signature for that
    payment, and the x402 manifest's maxTimeoutSeconds is 60. A duplicate retry after an ambiguous timeout is
    therefore bounded by whether the same payment proof can be accepted twice — which the provider does not
    document either way. Quotes are single-use and expire after 24 hours, which limits (but does not
    eliminate) duplicate task acceptance.
  gaps:
  - No idempotency key on the thirteen paid /v1/* job routes or the two /x402/* relay routes.
  - No idempotency key on POST /v1/tasks/quote, /accept, /card-intake, /usdt-accept or the Robinhood intents.
  - No documented safe-retry guidance for a 202 that was sent but not received.
dry_run_mode:
  supported: true
  status: documented
  mechanism: dedicated free twin routes
  surfaces:
  - operation: 'POST /v1/demo (no operationId)'
    cost: free, no key, no payment
    description: 'Non-persistent data-distillation demo (500 characters, 5 fields); the response names the paid service it rehearses ("paid_service": "data-distill").'
    probe: 'POST with {"text": "...", "fields": ["vendor","amount"]} answered 200 on 2026-09-19.'
  - operation: 'POST /v1/trust/preview (no operationId); MCP trust_preview; A2A trust-preview'
    cost: free, no wallet
    description: '"Free deterministic preview of a supplied Agent Card, permissions, and authorization boundary. No job or revenue record is created."'
  - operation: 'MCP compatibility_check; https://avalix.ai/autonoma/check'
    cost: free
    description: Static MCP/A2A/OpenAPI check that returns findings, evidence hashes, limitations and "the closest fixed-scope repair option".
  - operation: 'POST /v1/tasks/quote; MCP quote_task'
    cost: free
    description: '"A quote does not deploy anything" (token-launch form) and "quoting itself is free" (agent card); the quote is the rehearsal for every paid custom task.'
  detail: sandbox/avalix-ai-sandbox.yml
reversibility:
  grade: documented
  docs: https://avalix.ai/autonoma/
  note: >-
    A reversal path exists on the human side — cancel before work starts, operator-approved refunds — and
    the site-wide Terms state a 14-day window for asking, so the grade is documented (0.4). It is not
    verified (1.0) because no API operation performs a cancel or refund, the 14-day window is a window for
    EMAILING, not a guaranteed reversal, and delivered work is expressly non-refundable. Nothing below asserts
    a window the provider has not written down.
  write_surfaces:
  - operation: 'POST /v1/tasks/quote -> /accept | /card-intake | /usdt-accept | /robinhood-eth-accept'
    action: Commission bounded paid work against a fixed quote
    reversal: cancel before work starts via the private project thread; refund only with operator approval
    reversal_operation: 'POST /v1/projects/{project_id}/messages (the thread is the cancellation channel; no cancel operation exists)'
    window: 'before work starts (cancellation); "within 14 days of purchase" to request a refund (site Terms)'
    stated_terms:
    - source: https://avalix.ai/autonoma/
      verbatim: 'Cancellation: Quotes expire after 24 hours. Before work starts, request cancellation through the private project thread. Refunds require operator approval; completed or delivered work is not refundable.'
    - source: https://avalix.ai/terms
      verbatim: "Refunds: We offer refunds on a case-by-case basis. If you're not satisfied, email us within 14 days of purchase and we'll work it out."
    grade: documented
  - operation: 'trust_preflight, agent_card_lint, receipt_verifier, data_distill, mcp_compatibility, openapi_repair, agent_contract, research_brief (x402 paid jobs)'
    action: Pay per job in USDC and receive a deterministic result or signed artifact
    reversal: none documented for a completed job; the site Terms' case-by-case refund clause is the only path
    reversal_operation: null
    window: null
    grade: documented
    note: On-chain USDC payment is final at the rail; a Trust Passport is described as short-lived and expires on its own schedule (not published), which is expiry, not reversal.
  - operation: integration_warranty_7d
    action: Activate a seven-day signed availability warranty for one endpoint
    reversal: none documented
    window: null
    grade: none
    note: Time-bounded by design (7 days); no early termination or refund is described.
  - operation: monitor
    action: Create a bounded public-source monitoring result
    reversal: none documented
    grade: none
  - operation: 'agent_risk_scan, agent_audit, agent_security_test'
    action: Authorized review or test of a customer-owned agent configuration
    reversal: not applicable to a read-only review; the payment follows the job rules above
    grade: documented
    note: 'Gated by an authorization attestation: "Security work requires explicit owner authorization and bounded target scope." Payment never expands authority (agents page).'
  - operation: 'POST /v1/projects/{project_id}/messages'
    action: Post a message into a private project thread
    reversal: none
    grade: none
  - operation: 'POST /x402/agent-card-linter, POST /x402/data-validator'
    action: Pay-per-call deterministic check relayed through PayanAgent
    reversal: none documented
    grade: none
    note: 'Sub-dollar calls ($0.10 / $1.00); the manifest''s accounting_policy states revenue is recorded only after settlement is linked to a successful call.'
