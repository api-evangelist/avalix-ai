payment:
  protocol: x402
  asset: USDC (0x833589fcd6edb6e08f4c7c32d4f71b54bda02913)
  network: Base (eip155:8453)
  recipient: 0xb747D079416A84d7F35e686Ea4a4252aacBEA0F3 (published as treasury_address in /.well-known/agent.json)
  flow: >-
    POST the paid route; receive 402 with a Payment-Required header and a JSON body (quoted_usdc,
    asset_contract, recipient, payment_uri, submit); pay the exact amount; retry the same POST with
    Payment-Signature. llms.txt: "Use an x402-compatible wallet to create the signed Payment-Signature
    authorization, then retry the same POST. A Payment-Signature is not a pasted transaction hash." (The
    live 402 body's submit line reads "Payment-Signature: <Base transaction hash>" — the two disagree on
    what the proof is; the live challenge is authoritative for a given call.)
  other_rails: [card via POST /v1/tasks/card-intake (Stripe), native Ethereum USDT via /v1/tasks/usdt-accept, Robinhood Chain ETH via a ten-minute intent, marketplace escrow (Hunazo), prefunded marketplace wallet (Agoragentic), sBTC inbox (AIBTC)]
  safety_rules: ['Never send a private key, seed phrase, password, or unrelated confidential data.', 'Security work requires explicit owner authorization and bounded target scope.', 'Payment never expands authority.']
audience_split:
