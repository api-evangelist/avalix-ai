async_pattern:
  style: accept-then-poll
  description: 'Every paid job route answers 202 "Paid job accepted"; the result is read with GET /v1/jobs/{job_id} (uuid) under the report token, or, for the public artifacts, GET /v1/trust/passports/{passport_id} and GET /v1/warranties/{warranty_id} without a token. No webhooks or push notifications (agent card capabilities.pushNotifications false).'
