payment_terms:
  x402:
    network: Base (eip155:8453)
    asset: USDC 0x833589fcd6edb6e08f4c7c32d4f71b54bda02913
    recipient: 0xb747D079416A84d7F35e686Ea4a4252aacBEA0F3 (the treasury_address the provider publishes in /.well-known/agent.json)
    scheme: exact
    max_timeout_seconds: 60
    flow: POST the route; receive 402 with a Payment-Required header and JSON body (quoted_usdc, asset_contract,
      recipient, payment_uri); pay; retry the same POST with Payment-Signature
  other_rails:
  - card (Stripe, per the privacy policy) via POST /v1/tasks/card-intake
  - native Ethereum USDT via POST /v1/tasks/usdt-accept
  - Robinhood Chain ETH via a ten-minute exact-amount intent (POST /v1/tasks/robinhood-eth-intent then -accept)
  - 'marketplace rails: Agoragentic prefunded USDC, Hunazo escrow (2% fee), AIBTC 100-sat sBTC inbox'
