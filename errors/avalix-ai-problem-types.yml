  applies_to: [trust_preflight, agent_card_lint, receipt_verifier, data_distill, agent_risk_scan, agent_audit, agent_security_test, research_brief, monitor, integration_warranty_7d, mcp_compatibility, openapi_repair, agent_contract, 'POST /x402/agent-card-linter', 'POST /x402/data-validator']
