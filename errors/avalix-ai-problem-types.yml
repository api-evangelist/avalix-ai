summary: >-
  The Autonoma contract declares 4xx/5xx responses by description only — no error schema, no
  application/problem+json, no error code enumeration. Live responses use a flat {"error": "<message>"}
  JSON object (observed: 400 {"error": "agent_card must be a JSON object"}, 400 {"error": "Invalid offer
  ID"}, 404 {"error": "not found"}, 503 {"error": "passport verification key unavailable"}). The one
  structured error is the x402 challenge: HTTP 402 with a Payment-Required header and a PaymentRequired JSON
  body (status "payment_required", quoted_usdc, network, chain_id, asset, asset_contract, recipient,
  payment_uri, submit). JSON-RPC 2.0 error objects are used on /mcp and /a2a/v1 (-32601 Method not found,
  -32001 Task not found).
envelope:
  rest: '{"error": string}'
  x402: 'HTTP 402 + Payment-Required header + PaymentRequired object (components.schemas.PaymentRequired)'
  json_rpc: '{"jsonrpc": "2.0", "id": ..., "error": {"code": int, "message": string}}'
  rfc9457: false
