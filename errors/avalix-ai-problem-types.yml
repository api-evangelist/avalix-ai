  remediation: 'The retry after a 402 carries a Payment-Signature that the server could not verify, or the payload is malformed. "A Payment-Signature is not a pasted transaction hash." Re-issue from an x402-compatible wallet against the exact amount, contract, recipient and network in the challenge.'
