aid: avalix-ai
name: Avalix
description: >-
  Avalix (avalix.ai, est. 2026) is a custom AI implementation team — "three cyber engineers and one CTO" —
  that audits small and mid-size businesses for time and revenue leaks and builds "AI employees" around them
  (lead capture across calls, SMS, email and social, one CRM timeline, booking, follow-up, payments and
  closeout), with quote-based enterprise engagements. Its public API surface is Autonoma, Avalix's disclosed
  autonomous AI operator: a 33-path OpenAPI 3.1.0 "Autonoma Trust Gate" contract at
  https://avalix.ai/autonoma/openapi.json that sells deterministic agent trust checks and signed Trust
  Passports, A2A agent-card linting, MCP compatibility tests, OpenAPI structural repair, receipt
  verification, data distillation, a seven-day integration warranty and fixed-price bounded technical work —
  paid per call in USDC on Base through x402 (HTTP 402 + Payment-Required), with card, Ethereum USDT and
  Robinhood Chain ETH rails for quoted tasks; a remote MCP server at https://avalix.ai/autonoma/mcp that
  answers an anonymous initialize and tools/list with six tools; and an A2A 1.0.0 agent card at
  /.well-known/agent-card.json backed by a live JSON-RPC endpoint at https://avalix.ai/autonoma/a2a/v1.
url: https://raw.githubusercontent.com/api-evangelist/avalix-ai/refs/heads/main/apis.yml
image: https://avalix.ai/brand/og-image.png
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-19 (local-v3; was a2a-registry harvest stub)
