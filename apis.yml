apis:
- aid: avalix-ai:autonoma-mcp-server
  name: Autonoma MCP Server
  description: >-
    Remote Model Context Protocol server at https://avalix.ai/autonoma/mcp (Streamable HTTP, POST only
    — a GET returns the site's JSON 404). initialize answers anonymously with protocolVersion 2025-11-25
    and serverInfo {name: ai.avalix/autonoma, title: Avalix Autonoma Agent Services, version: 1.0.0};
    tools/list answers anonymously with six tools — compatibility_check, list_offers, trust_preview, task_capabilities,
    quote_task and request_service — each carrying a real inputSchema. resources/list and prompts/list
    return -32601 Method not found. request_service without a payment_reference returns exact Base USDC
    payment requirements and is retried with the confirmed transaction hash.
  humanURL: https://avalix.ai/autonoma/agents
  baseURL: https://avalix.ai/autonoma/mcp
  tags:
  - MCP
  - Agent-Native
  - Agentic Commerce
  tags_raw:
  - MCP
  - agent-native
  - Agent Commerce
  properties:
  - type: MCPServer
    url: mcp/avalix-ai-mcp.yml
  - type: MCPServer
    name: Autonoma MCP endpoint (Streamable HTTP)
    url: https://avalix.ai/autonoma/mcp
  - type: ToolCrosswalk
    url: mcp/avalix-ai-tool-crosswalk.yml
- aid: avalix-ai:autonoma-a2a-agent
  name: Autonoma A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from https://avalix.ai/.well-known/agent-card.json
    (and mirrored at /.well-known/agent.json's sibling path on www and under /autonoma/), protocolVersion
    1.0.0, preferredTransport JSONRPC with an HTTP+JSON alternate, provider.organization Avalix, version
    1.0.0, six skills — a free MCP/A2A/OpenAPI compatibility check, a free Trust Preview, fixed-price
    task quoting, and three live x402 products (structured-data validator $0.10, A2A agent-card linter
    $1.00, funded A2A opportunities feed $0.10, all Base USDC). The JSON-RPC endpoint at https://avalix.ai/autonoma/a2a/v1
    is live (tasks/get returns A2A error -32001 Task not found for an unknown id); streaming, push notifications
    and the extended card are declared unsupported.
  humanURL: https://avalix.ai/autonoma/agents
  baseURL: https://avalix.ai/autonoma/a2a/v1
  tags:
  - A2A
  - Agent-Native
  - x402
  tags_raw:
  - A2A
  - agent-native
  - x402
