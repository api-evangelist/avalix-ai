  domain_standard_signature: true
  note: 'The contract itself carries the signature — a PaymentRequired component schema with const network "base" / chain_id 8453 / asset "USDC" and a declared Payment-Required response header — which is the contract-level marker for agent commerce this market has. The live body uses scheme "onchain" and a transaction-hash retry, so this is x402-shaped settlement with a provider-specific proof step rather than a facilitator-verified x402 exact payload; recorded as observed, not certified.'
