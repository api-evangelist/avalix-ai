summary: >-
  Avalix's conformance profile is the agent-commerce protocol stack rather than any enterprise or sector
  standard: an A2A 1.0.0 agent card graded conformant, an MCP server at protocol version 2025-11-25,
  JSON-RPC 2.0 on both, an x402 discovery manifest at x402Version 2 with the "exact" scheme on
  eip155:8453 (CAIP-2) and live HTTP 402 challenges carrying a Payment-Required header, EIP-681 payment
  URIs, a JWKS route for Trust Passport verification (503 at probe time), an RFC 9116 security.txt and an
  llms.txt. It declares no OAuth/OIDC, no RFC 9457 problem details, no RFC 9727 API catalog, no RFC 8594
  sunset signalling and no idempotency mechanism. The enterprise page offers "SOC 2 / HIPAA friendly
  designs" for custom deployments — a design posture, not a certification — so no Compliance pointer is
  emitted.
