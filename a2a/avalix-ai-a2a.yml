grade_basis: >-
  Graded against A2A 1.0.0 hard checks: capabilities is an OBJECT (pass), protocolVersion is present
  ("1.0.0", pass), skills is an ARRAY of six (pass). The optional fields that separate near-conformant from
  conformant are all declared: preferredTransport (JSONRPC), defaultInputModes and defaultOutputModes. Every
  declared interface is HTTPS and answers JSON-RPC.
deviations:
- field: additionalInterfaces + supportedInterfaces
  observed: both arrays declared, describing the same two endpoints
  note: >-
    additionalInterfaces is the 0.x field and supportedInterfaces the 1.0 field; the card carries both, and
    the nested protocolVersion is "1.0" while the top-level protocolVersion is "1.0.0". Redundant rather
    than wrong — a 0.x client and a 1.0 client both find the endpoint.
- field: securitySchemes / security
  observed: absent
  note: >-
    The card declares no securitySchemes, not even an empty object for unauthenticated public access —
    the exact finding Autonoma's own agent-card linter sample flags as "security:explicit" (low severity).
    Paid skills are gated by x402 payment, not by an authentication scheme.
- field: skills[3..5].id
  observed: payanagent-<offer id>
  note: >-
    Three skill ids are PayanAgent marketplace offer identifiers rather than semantic ids; each skill's
    description and examples[] carry the stable first-party POST route on avalix.ai, so the ids are
    routable but opaque.
- field: skills[].examples
  observed: present on 4 of 6 skills, as URLs or one prompt string
  note: The three paid skills use examples[] to carry the purchase URL rather than an example utterance.
- field: capabilities.extensions
  observed: empty array
  note: >-
    Payment is by x402 over the REST routes named in the skill descriptions; the card does not declare the
    a2a-x402 payment extension URI, so an A2A client learns the payment rail from prose, not from a declared
    extension.
conformance:
  spec: A2A 1.0.0
  grade: conformant
