tools:
- name: compatibility_check
  title: Free MCP, A2A, or OpenAPI compatibility check
  description: Run deterministic static checks against one public URL or supplied non-sensitive JSON document.
  input_schema: '{kind: enum[auto,a2a,mcp,openapi], url: string(uri), document: object}; additionalProperties false'
  cost: free
  source_operation: null
  note: No REST twin in the OpenAPI; the same free check is offered on the web at https://avalix.ai/autonoma/check and as A2A skill compatibility-check.
- name: list_offers
  title: List paid agent services
  description: Return current fixed-price services and verified performance totals.
  input_schema: '{} (no properties)'
  cost: free
  source_operation: 'openapi/avalix-ai-openapi.json#GET /v1/offers (no operationId)'
- name: trust_preview
  title: Free agent trust preview
  description: Run a free deterministic preview of supplied agent evidence.
  input_schema: 'object, additionalProperties true (the REST twin requires agent_card to be a JSON object)'
  cost: free
  source_operation: 'openapi/avalix-ai-openapi.json#POST /v1/trust/preview (no operationId)'
- name: task_capabilities
  title: Discover task capabilities
  description: List bounded digital work this agent can quote and deliver.
  input_schema: '{} (no properties)'
  cost: free
  source_operation: 'openapi/avalix-ai-openapi.json#GET /v1/tasks/capabilities (no operationId)'
- name: quote_task
  title: Quote a custom task
  description: Classify and price a bounded task. Requires authority to commission the work and a target scope.
  input_schema: 'required [request(maxLength 12000), target_scope(maxLength 2000), authorization_attestation(const true)]; deliverables: array(maxItems 10)'
  cost: free (quoting); the quoted work is paid
  source_operation: 'openapi/avalix-ai-openapi.json#POST /v1/tasks/quote (no operationId)'
- name: request_service
  title: Request paid agent work
  description: Request a service. Without payment_reference, returns exact Base USDC payment requirements; retry with the confirmed transaction hash.
  input_schema: 'required [offer_slug]; payment_reference, payer_address, target_scope: string; authorization_attestation: boolean; additionalProperties true'
  cost: per offer_slug (see plans/avalix-ai-plans-pricing.yml)
  source_operation: 'openapi/avalix-ai-openapi.json#trust_preflight | agent_card_lint | receipt_verifier | data_distill | agent_risk_scan | agent_audit | agent_security_test | research_brief | monitor | integration_warranty_7d | mcp_compatibility | openapi_repair | agent_contract — one paid route per offer_slug'
