summary: >-
  Avalix operates ONE remote MCP server at https://avalix.ai/autonoma/mcp — the same origin as its website,
  the Autonoma OpenAPI and the A2A JSON-RPC endpoint. It is POST-only Streamable HTTP (a GET returns the
  JSON 404 {"error": "not found"}), reports MCP protocol version 2025-11-25, identifies itself as serverInfo
  {name: ai.avalix/autonoma, title: Avalix Autonoma Agent Services, version: 1.0.0, websiteUrl:
  https://avalix.ai/autonoma/}, and answers initialize and tools/list anonymously with six tools carrying
  real inputSchemas. resources/list and prompts/list return -32601 Method not found. The server's own
  initialize instructions read: "Avalix-owned service endpoint. Discover fixed-price services, run free
  previews, and request paid work. Never provide secrets." The tool names and descriptions are
  Autonoma-specific (list_offers, trust_preview, quote_task with an authorization_attestation const,
  request_service keyed on offer_slug) and match no shared platform fingerprint — a provider-built server.
  No MCP host of its own exists (mcp.avalix.ai does not resolve); the MCP resource host is the apex.
deployment:
  mode: remote
  endpoint: https://avalix.ai/autonoma/mcp
  auth: none
  verified: probed
  note: >-
    A hosted HTTPS endpoint an MCP client POSTs to directly; Avalix ships no stdio package and documents no
    npx/uvx install (npm and PyPI searched 2026-09-19, nothing first-party). auth is "none" in the connection
    sense — initialize and tools/list need no credential, and no OAuth metadata is served for this resource
    (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource return 404 on the apex
    and JSON 404 under /autonoma/). Paid work is gated by x402 PAYMENT: request_service without a
    payment_reference "returns exact Base USDC payment requirements; retry with the confirmed transaction
    hash". That is an economic gate on invocation, not an authentication scheme on the server.
servers:
